<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AWS Student Builder Group at Okan University">
  <rect width="100" height="100" fill="#1e2b3b"/>
  <g fill="#f5a623">
    <!-- chip body: square frame with a large hollow centre -->
    <path fill-rule="evenodd" d="M31 31h38v38H31z M37 37h26v26H37z"/>
    <!-- top: solid flange + 3 merlons -->
    <rect x="31" y="24" width="38" height="7"/>
    <rect x="31" y="16" width="10" height="8"/>
    <rect x="45" y="16" width="10" height="8"/>
    <rect x="59" y="16" width="10" height="8"/>
    <!-- bottom: solid flange + 3 merlons -->
    <rect x="31" y="69" width="38" height="7"/>
    <rect x="31" y="76" width="10" height="8"/>
    <rect x="45" y="76" width="10" height="8"/>
    <rect x="59" y="76" width="10" height="8"/>
    <!-- left: solid rail + 3 pins -->
    <rect x="24" y="31" width="7" height="38"/>
    <rect x="16" y="31" width="8" height="10"/>
    <rect x="16" y="45" width="8" height="10"/>
    <rect x="16" y="59" width="8" height="10"/>
    <!-- right: solid rail + 3 pins -->
    <rect x="69" y="31" width="7" height="38"/>
    <rect x="76" y="31" width="8" height="10"/>
    <rect x="76" y="45" width="8" height="10"/>
    <rect x="76" y="59" width="8" height="10"/>
  </g>
</svg>
